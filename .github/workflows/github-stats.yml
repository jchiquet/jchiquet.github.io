      - name: "Pin: jchiquet/MAP566 (light)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=jchiquet&repo=MAP566&theme=default&hide_border=true
          path: assets/img/github-stats/pin-jchiquet-MAP566-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Pin: jchiquet/MAP566 (dark)"
        uses: stats-organization/github-readme-stats-action@v2
