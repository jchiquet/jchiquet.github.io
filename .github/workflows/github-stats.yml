        with:
          card: pin
          options: username=computorg&repo=template-computo-python&theme=dark&hide_border=true
          path: assets/img/github-stats/pin-computorg-template-computo-python-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/github-stats/*.svg
          git commit -m "Update GitHub stats cards" || exit 0
          git push
