      - name: "Pin: jchiquet/MAP573 (light)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=jchiquet&repo=MAP573&theme=default&hide_border=true
          path: assets/img/github-stats/pin-jchiquet-MAP573-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Pin: jchiquet/MAP573 (dark)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=jchiquet&repo=MAP573&theme=dark&hide_border=true
          path: assets/img/github-stats/pin-jchiquet-MAP573-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pin: computorg/computorg.github.io (light)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=computorg&repo=computorg.github.io&theme=default&hide_border=true
          path: assets/img/github-stats/pin-computorg-computorg.github.io-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Pin: computorg/computorg.github.io (dark)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=computorg&repo=computorg.github.io&theme=dark&hide_border=true
          path: assets/img/github-stats/pin-computorg-computorg.github.io-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pin: computorg/computo-quarto-extension (light)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=computorg&repo=computo-quarto-extension&theme=default&hide_border=true
          path: assets/img/github-stats/pin-computorg-computo-quarto-extension-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Pin: computorg/computo-quarto-extension (dark)"
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=computorg&repo=computo-quarto-extension&theme=dark&hide_border=true
          path: assets/img/github-stats/pin-computorg-computo-quarto-extension-dark.svg
