- category: ongoing
  heading: Ongoing Projects
  entries:
    - title: DISCERN
      subtitle: Discovering the causes of three poorly understood cancers in Europe
      url: https://discern.iarc.who.int/
      dates: "2023–2027"
      funding: Horizon Europe
      partners: 20 partners
      involvement: "Team leader, €250,000 for MIA Paris-Saclay"
      description: >
        DISCERN investigates the causes of three poorly understood cancers (renal, pancreatic,
        colorectal) and the geographical disparities in their incidence across Europe, notably the
        higher rates observed in Central and Eastern Europe. The 20-institution consortium,
        coordinated by IARC, combines epidemiological, exposomic and multi-omics approaches within
        the Horizon Europe Mission on Cancer. I co-lead the methodological work package with
        Imperial College.
    - title: CoBreeding
      url: https://www.pepr-agroeconum.fr/les-projets-finances/socio-ecosysteme/projets-cibles/cobreeding
      dates: "2024–2027"
      funding: PEPR Agroécologie Numérique
      partners: GQE Le Moulon, HeuDiaSyC (UTC)
      description: >
        CoBreeding develops statistical and deep learning methods to predict the performance of maize
        hybrids from pools of parental lines, combining mixed models from quantitative genetics with
        neural network architectures, and transferring information between US and European maize line
        populations. Funds the PhD of François Victor.
    - title: HEPATOTWIN
      url: https://digitbio.hub.inrae.fr/rubriques-verticales2/nos-actions/projets-phares/projet-phare-hepato-twin-2024-2028
      dates: "2024–2027"
      funding: INRAE Metaprogramme DIGIT-BIO
      partners: INRAE (Toxalim, MIA-PS, NumeCan, UNH, TBI)
      description: >
        HEPATOTWIN gathers INRAE units in toxicology, applied mathematics and nutrition to develop
        modelling approaches for liver toxicology.

- category: past
  heading: Past Projects
  entries:
    - title: "EXPANSE"
      subtitle: "EXposome Powered tools for healthy living in urbAN SEttings"
      url: https://expanseproject.eu/
      dates: "2020–2025"
      funding: Horizon H2020
      partners: Imperial College, Utrecht, Columbia, Inserm, IARC + 15 others
      description: >
        EXPANSE studies how the urban exposome -- environmental exposures specific to city living --
        affects cardiometabolic and pulmonary disease, Europe's leading disease burden. It combines
        exposome and health data from over 55 million Europeans, multi-omics data from 2 million
        individuals, and personalized exposure assessment for 5,000 participants across five urban
        regions.
    - title: "G2WAS"
      subtitle: "Grape Genes for WAter Scarcity"
      url: https://anr.fr/Project-ANR-19-CE20-0024
      dates: "2020–2024"
      funding: ANR
      partners: MIA Paris-Saclay, AGAP, LEPSE (INRAE)
      involvement: "Team leader, €60,000 for MIA-Paris"
      description: >
        G2WAS aims to identify the genetic regulators of grapevine adaptation to water deficit
        through genome-wide association studies (GWAS), to support the breeding of drought-tolerant
        varieties in the context of climate change.
    - title: "SingleStatOmics"
      url: http://anr-singlestatomics.pages.math.cnrs.fr
      dates: "2019–2024"
      funding: ANR
      partners: University of Lyon 1, Mines ParisTech, ENS Lyon, AgroParisTech/INRA
      involvement: "12 months, co-PI and team leader, €210,000 for MIA-Paris"
      description: >
        SingleStatOmics develops statistical and machine learning methods for single-cell genomics, to
        study cell identity, cell differentiation dynamics, gene regulation and single-cell
        epigenomics, combining expertise in statistics, machine learning and optimal transport.
    - title: "Behind the Count'her"
      subtitle: "Estimating genetic parameters for high-dimensional count data with the Poisson-lognormal model"
      dates: "2023–2024"
      funding: INRAE Metaprogramme DIGIT-BIO
      partners: INRAE (GenPhyse, MIA-PS, MaIAGE), Sorbonne U
    - title: "EcoNet"
      subtitle: "Advanced statistical modelling of ecological networks"
      url: https://cmatias.perso.math.cnrs.fr/ANR_EcoNet.html
      dates: "2019–2023"
      funding: ANR
      partners: Sorbonne, Lyon 1 and Lille Universities, AgroParisTech/INRAE, ISEM, IEES
      description: >
        EcoNet develops statistical methods for the analysis of ecological networks (trophic,
        mutualistic, competitive, host-parasite), integrating space and time, multiple interaction
        types, covariate information and sampling effects, to predict how ecosystems respond to
        environmental change.
